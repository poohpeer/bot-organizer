name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    # Unlike the sibling project, almost every test here talks to a real
    # database — there are no mocked repositories. Without this service the
    # suite does not skip, it fails: 143 errors out of 242.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No GROQ_API_KEY: the chain treats Groq as optional and falls back to
      # Gemini alone, which is the configuration the suite is written against.
      # BOT_TOKEN / GEMINI_API_KEY / GOOGLE_MAPS_API_KEY get fake values from
      # tests/conftest.py. Nothing here reaches a live API.
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  build-and-push:
    needs: test
    # Only for main. A pull request cannot push to the registry anyway, and
    # building the image twice per change buys nothing — the Dockerfile is
    # already exercised by the build step below on every merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    permissions:
      contents: read
      packages: read

    env:
      # The credentials live on the deployment machine, not in the repository
      # and not in Actions secrets. This is the persistent copy; the workspace
      # gets a throwaway one below, because compose resolves `env_file: .env`
      # relative to the compose file it is given.
      ENV_FILE: C:\bots\bot-organizer\.env
      # Deploy the exact artifact this run built. `latest` would race a newer
      # merge and could roll out something this run never tested.
      BOT_IMAGE_TAG: ${{ github.sha }}
      COMPOSE: -f docker-compose.yml -f docker-compose.ghcr.yml

    steps:
      - uses: actions/checkout@v5

      - name: Check the machine is set up
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ENV_FILE)) {
            throw "$env:ENV_FILE is missing. See docs/deployment.md — the runner does not create it, and deploying without it would start the stack with no credentials."
          }
          docker version --format '{{.Server.Os}}' | Tee-Object -Variable os
          if ($os -ne 'linux') {
            throw "Docker is in $os container mode; this image is linux/amd64. Switch Docker Desktop to Linux containers."
          }

      - name: Log in to GHCR
        shell: pwsh
        run: |
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        shell: pwsh
        run: |
          Copy-Item $env:ENV_FILE .env -Force
          docker compose $env:COMPOSE.Split(' ') pull
          docker compose $env:COMPOSE.Split(' ') up -d --remove-orphans

      - name: Verify the stack came up
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          docker compose $env:COMPOSE.Split(' ') ps
          $bad = docker compose $env:COMPOSE.Split(' ') ps --format json |
            ConvertFrom-Json | Where-Object { $_.State -ne 'running' }
          if ($bad) {
            docker compose $env:COMPOSE.Split(' ') logs --tail 50
            throw "Not running after deploy: $($bad.Service -join ', ')"
          }

      - name: Remove the credentials from the workspace
        if: always()
        shell: pwsh
        run: Remove-Item .env -Force -ErrorAction SilentlyContinue

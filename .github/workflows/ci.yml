name: CI

on:
  push:
    # 0001-S10-deployment is where the cluster is deployed from until it is
    # merged; drop it from this list then.
    branches: [main, 0001-S10-deployment]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    # Unlike the sibling project, almost every test here talks to a real
    # database — there are no mocked repositories. Without this service the
    # suite does not skip, it fails: 143 errors out of 242.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No GROQ_API_KEY: the chain treats Groq as optional and falls back to
      # Gemini alone, which is the configuration the suite is written against.
      # BOT_ORGANIZER_BOT_TOKEN / GEMINI_API_KEY / GOOGLE_MAPS_API_KEY get fake values from
      # tests/conftest.py. Nothing here reaches a live API.
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  build-and-push:
    needs: test
    # Pushes only. A pull request cannot push to the registry anyway, and
    # building the image twice per change buys nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Behind `test`, through build-and-push. The separate deploy-k8s.yml this
    # replaces built and pushed its own image with no test gate at all, so a
    # commit that broke the suite still reached the cluster.
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      # Windows PowerShell 5.1, not pwsh and not bash. pwsh (PowerShell 7) is
      # not installed on this runner, and `bash` on its PATH resolves to the
      # WSL stub in WindowsApps, which fails with execvpe(/bin/bash) because no
      # distro is installed. 5.1 ships with Windows and always works — at the
      # cost of no `&&`, which is why these are separate statements.
      - name: Preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command kubectl -ErrorAction SilentlyContinue)) {
            throw "kubectl is not on the runner service PATH."
          }
          kubectl version --client
          Write-Host "--- cluster ---"
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) { throw "No reachable cluster for the runner user." }
          Write-Host "--- namespace ---"
          kubectl config view --minify -o "jsonpath={..namespace}"
          Write-Host ""
          Write-Host "--- our resources ---"
          kubectl get deployment bot-organizer-bot bot-organizer-worker
          kubectl get statefulset bot-organizer-postgres
          kubectl get secret bot-organizer-secrets bot-organizer-ghcr-pull-secret
          Write-Host "--- verdict ---"
          kubectl get deployment bot-organizer-bot | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Deployments do not exist yet. Run 'kubectl apply -k k8s/' once, per k8s/README.md."
          }
          Write-Host "ok"

      # Without this the workflow only ever restarts pods, so a change to a
      # manifest — an added env var, a resource limit, a new volume — lives in
      # git and never reaches the cluster. The Secret is deliberately not in
      # the kustomization: it is gitignored and applied by hand.
      - name: Apply manifests
        shell: powershell
        run: |
          kubectl apply -k k8s/
          if ($LASTEXITCODE -ne 0) { throw "kubectl apply failed" }

      # Still needed after the apply: the image tag is :latest, so a rebuilt
      # image is not a spec change and apply alone would see nothing to do.
      - name: Restart bot
        shell: powershell
        run: kubectl rollout restart deployment/bot-organizer-bot

      - name: Restart worker
        shell: powershell
        run: kubectl rollout restart deployment/bot-organizer-worker

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/bot-organizer-bot --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "bot rollout did not complete" }
          kubectl rollout status deployment/bot-organizer-worker --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "worker rollout did not complete" }

      # A completed rollout is weaker evidence than it looks: these pods have
      # no readiness probe, so one counts as available the moment it starts,
      # and a crash thirty seconds later would not fail the step above. The
      # startup lines are the real proof — the bot only logs its identity
      # after a successful getMe against Telegram.
      - name: Verify the bot is actually running
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          kubectl get pods -l app=bot-organizer-bot
          kubectl get pods -l app=bot-organizer-worker

          $restarts = kubectl get pods -l app=bot-organizer-bot -o "jsonpath={.items[*].status.containerStatuses[*].restartCount}"
          Write-Host "bot restarts: $restarts"

          $botLog = kubectl logs deployment/bot-organizer-bot --tail=100 2>&1 | Out-String
          $workerLog = kubectl logs deployment/bot-organizer-worker --tail=50 2>&1 | Out-String
          Write-Host "--- bot ---"
          Write-Host $botLog
          Write-Host "--- worker ---"
          Write-Host $workerLog

          if ($botLog -notmatch 'Resolved bot identity') {
            throw "The bot never reached Telegram: no 'Resolved bot identity' line."
          }
          if ($workerLog -notmatch 'Worker started') {
            throw "The worker never started its poll loop."
          }
          if ($botLog -match 'GROQ_API_KEY is not set') {
            Write-Host "::warning::GROQ_API_KEY is missing from the cluster Secret - the bot is running on Gemini alone."
          }
          Write-Host "both processes are up"

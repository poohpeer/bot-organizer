name: Deploy to Kubernetes

on:
  push:
    branches: [0001-S10-deployment]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      # Windows PowerShell 5.1, not pwsh and not bash. pwsh (PowerShell 7) is
      # not installed on this runner, and `bash` on its PATH resolves to the
      # WSL stub in WindowsApps, which fails with execvpe(/bin/bash) because no
      # distro is installed. 5.1 ships with Windows and always works — at the
      # cost of no `&&`, which is why these are separate statements.
      - name: Preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command kubectl -ErrorAction SilentlyContinue)) {
            throw "kubectl is not on the runner service PATH."
          }
          kubectl version --client
          Write-Host "--- cluster ---"
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) { throw "No reachable cluster for the runner user." }
          Write-Host "--- namespace ---"
          kubectl config view --minify -o "jsonpath={..namespace}"
          Write-Host ""
          Write-Host "--- our resources ---"
          kubectl get deployment bot-organizer-bot bot-organizer-worker
          kubectl get statefulset bot-organizer-postgres
          kubectl get secret bot-organizer-secrets bot-organizer-ghcr-pull-secret
          Write-Host "--- verdict ---"
          kubectl get deployment bot-organizer-bot | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Deployments do not exist yet. Run 'kubectl apply -k k8s/' once, per k8s/README.md."
          }
          Write-Host "ok"

      - name: Restart bot
        shell: powershell
        run: kubectl rollout restart deployment/bot-organizer-bot

      - name: Restart worker
        shell: powershell
        run: kubectl rollout restart deployment/bot-organizer-worker

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/bot-organizer-bot --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "bot rollout did not complete" }
          kubectl rollout status deployment/bot-organizer-worker --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "worker rollout did not complete" }

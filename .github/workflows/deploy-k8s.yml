name: Deploy to Kubernetes

on:
  push:
    branches: [0001-S10-deployment]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NAMESPACE: bot-organizer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Check kubectl access
        shell: pwsh
        run: kubectl version --client && kubectl cluster-info
      - name: Restart bot
        shell: pwsh
        run: kubectl -n $env:NAMESPACE rollout restart deployment/bot
      - name: Restart worker
        shell: pwsh
        run: kubectl -n $env:NAMESPACE rollout restart deployment/worker
      - name: Wait for rollout
        shell: pwsh
        run: |
          kubectl -n $env:NAMESPACE rollout status deployment/bot --timeout=180s
          kubectl -n $env:NAMESPACE rollout status deployment/worker --timeout=180s

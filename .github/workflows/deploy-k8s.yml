name: Deploy to Kubernetes

on:
  push:
    branches: [0001-S10-deployment]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      # One preflight that reports everything at once. Each run of this
      # workflow rebuilds the image first, so discovering the next missing
      # piece one failure at a time is expensive.
      - name: Preflight
        shell: bash
        run: |
          set +e
          echo "--- kubectl ---"
          command -v kubectl || { echo "MISSING: kubectl is not on the runner service PATH"; exit 1; }
          kubectl version --client
          echo "--- cluster ---"
          kubectl cluster-info || { echo "MISSING: no reachable cluster / kubeconfig for the runner user"; exit 1; }
          echo "--- namespace ---"
          kubectl config view --minify -o "jsonpath={..namespace}"; echo
          echo "--- our resources ---"
          kubectl get deployment bot-organizer-bot bot-organizer-worker 2>&1
          kubectl get statefulset bot-organizer-postgres 2>&1
          kubectl get secret bot-organizer-secrets bot-organizer-ghcr-pull-secret 2>&1
          echo "--- verdict ---"
          kubectl get deployment bot-organizer-bot >/dev/null 2>&1 \
            || { echo "MISSING: deployments do not exist yet. Run 'kubectl apply -k k8s/' once, per k8s/README.md."; exit 1; }
          echo "ok"
      - name: Restart bot
        shell: bash
        run: kubectl rollout restart deployment/bot-organizer-bot
      - name: Restart worker
        shell: bash
        run: kubectl rollout restart deployment/bot-organizer-worker
      - name: Wait for rollout
        shell: bash
        run: |
          kubectl rollout status deployment/bot-organizer-bot --timeout=180s
          kubectl rollout status deployment/bot-organizer-worker --timeout=180s

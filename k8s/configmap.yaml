apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-organizer-config
data:
  AI_PROXY_URL: http://ai-proxy:8787
  AI_PROXY_PROVIDER: groq
  # codex first, then claude, then the rest — asked for directly.
  #
  # This reverses a deliberate order, and the reason it was deliberate is
  # worth keeping: both are CLI-backed adapters in ai-proxy that accept a
  # tools array and silently ignore it — observed live as "start
  # provider=codex tools=26" followed by "complete ... tool_calls=0". Almost
  # everything this bot does needs a tool call, so a provider that drops them
  # does not degrade, it fabricates: asked to show the list, codex could not
  # reach the database and answered "доступ к данным организатора сейчас
  # недоступен". Their JSON classifier calls came back empty too.
  #
  # MCP closes half of that: MCP_BASE_URL below hands a CLI-backed model an
  # address and a per-turn grant, and it fetches the tools itself rather than
  # being handed an array it ignores. That covers the tool loop.
  #
  # It does not cover the classifier, and putting codex first here proved it
  # within the hour: the session start/stop decision asks for JSON against a
  # schema and declares no tools at all, codex answered nothing, extract()
  # failed closed on {} as designed, and the bot replied «Что отслеживаем?»
  # to «Едем в парк», «Море» and «Едем на море» in turn — unable to start a
  # session at any point. bot.ai.client.CLASSIFIER_MODELS now filters these
  # out of the classifier's chain, so this order is safe to keep.
  AI_PROXY_MODELS: codex:,claude:sonnet,openai/gpt-oss-120b,openai/gpt-oss-20b,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemma-4-31b-it
  # 30 seconds, and the bot's own client waits 35 — five seconds longer, so a
  # slow provider surfaces as the proxy's own error rather than the bot
  # hanging up first and reporting nothing useful.
  #
  # It was 600. That is not a timeout: a request that was accepted and never
  # answered left the bot silent for ten minutes, with no reply and no error,
  # while the person who wrote to it watched an empty chat.
  AI_PROXY_TIMEOUT_S: "30"
  # The whole turn, however many models and tools it takes. The per-request
  # timeout above bounds one call; a chain of eight models would still add up
  # to minutes without this.
  #
  # 60 rather than 30 because codex leads the chain and is slow: measured at
  # 13.2s, 16.7s and 20.4s on three consecutive live turns, each fetching its
  # tools over MCP. 20 seconds is two thirds of a 30-second budget, so the
  # first turn needing a couple of tool calls would have been cut off and
  # answered "не успел" — a deadline that fires on healthy turns teaches
  # people to ignore it.
  TURN_DEADLINE_SECONDS: "60"
  DEFAULT_TIMEZONE: Asia/Jerusalem
  QUIET_UNTIL_HOUR: "9"
  QUIET_FROM_HOUR: "21"
  REMINDER_MIN_INTERVAL_HOURS: "6"
  REMINDER_MIN_REPEAT_MINUTES: "5"
  # Where a CLI-backed model reaches this bot's tools. Unset means MCP is not
  # in use and no grant or address is issued at all. See docs/mcp.md.
  MCP_BASE_URL: http://bot-organizer-bot:8081
  MCP_PORT: "8081"
  # Comfortably longer than a turn's deadline and no longer: the grant exists
  # for the turn that issued it, and the router revokes it in a finally.
  # Equal to the deadline would be too tight — a CLI reaching for one last
  # tool at second 59 would find its own grant expired.
  MCP_GRANT_TTL_SECONDS: "90"
  CONVERSATION_TURNS: "5"
  CONVERSATION_MAX_AGE_MINUTES: "30"
  GROUP_SYNC_INTERVAL_SECONDS: "60"
  # Whoever runs this bot. They can open /admin in every chat it was added
  # to, whether or not they administer that chat: the models it calls are
  # spent from their account, so the provider chain is a decision about their
  # money. Leave unset in a deployment nobody owns personally — then only a
  # chat's own administrators qualify.
  BOT_OWNER_ID: "91237884"

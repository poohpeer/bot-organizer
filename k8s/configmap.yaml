apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-organizer-config
data:
  AI_PROXY_URL: http://ai-proxy:8787
  AI_PROXY_PROVIDER: groq
  # No codex: or claude: entries. Both are CLI-backed adapters in ai-proxy
  # that accept a tools array and silently ignore it — observed live as
  # "start provider=codex tools=26" followed by "complete ... tool_calls=0".
  # Almost everything this bot does needs a tool call, so a provider that
  # drops them does not degrade, it fabricates: asked to show the list,
  # codex could not reach the database and answered "доступ к данным
  # организатора сейчас недоступен", which is the confident-but-wrong reply
  # R10 forbids. Their JSON classifier calls came back empty too
  # ("extract() got an empty response"). Until ai-proxy refuses a
  # tool-bearing request it cannot serve, this chain stays on the providers
  # that actually support tool calling.
  AI_PROXY_MODELS: openai/gpt-oss-120b,openai/gpt-oss-20b,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemma-4-31b-it
  AI_PROXY_TIMEOUT_S: "600"
  DEFAULT_TIMEZONE: Asia/Jerusalem
  QUIET_UNTIL_HOUR: "9"
  QUIET_FROM_HOUR: "21"
  REMINDER_MIN_INTERVAL_HOURS: "6"
  REMINDER_MIN_REPEAT_MINUTES: "5"
  CONVERSATION_TURNS: "5"
  CONVERSATION_MAX_AGE_MINUTES: "30"
  GROUP_SYNC_INTERVAL_SECONDS: "60"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-organizer-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-organizer-bot
  template:
    metadata:
      labels:
        app: bot-organizer-bot
    spec:
      imagePullSecrets:
        - name: bot-organizer-ghcr-pull-secret
      containers:
        - name: bot
          image: ghcr.io/poohpeer/bot-organizer:latest
          imagePullPolicy: Always
          command: ["uv", "run", "--no-sync", "python", "-m", "bot.main"]
          envFrom:
            - secretRef:
                name: bot-organizer-secrets
            - configMapRef:
                name: bot-organizer-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-organizer-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-organizer-worker
  template:
    metadata:
      labels:
        app: bot-organizer-worker
    spec:
      imagePullSecrets:
        - name: bot-organizer-ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/poohpeer/bot-organizer:latest
          imagePullPolicy: Always
          command: ["uv", "run", "--no-sync", "python", "-m", "worker.main"]
          envFrom:
            - secretRef:
                name: bot-organizer-secrets
            - configMapRef:
                name: bot-organizer-config

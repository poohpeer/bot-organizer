apiVersion: v1
kind: Service
metadata:
  name: bot-organizer-postgres
spec:
  selector:
    app: bot-organizer-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bot-organizer-postgres
spec:
  serviceName: bot-organizer-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bot-organizer-postgres
  template:
    metadata:
      labels:
        app: bot-organizer-postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          # pgvector, not plain postgres:16. This instance is shared: the
          # notes-bot (a separate repository) keeps its embeddings in a
          # `vector` column of its own database on this server, and its
          # migrations run `CREATE EXTENSION vector`. Without the library the
          # extension is still registered in that database's catalog, so
          # every statement touching the table — a count, a delete, a search —
          # fails with `could not access file "$libdir/vector"`.
          #
          # It was set by hand on the cluster on 2026-09-14 and left out of
          # this file. CI applies the whole kustomization on every deploy, so
          # the next one (2026-10-11, run #213) put plain postgres:16 back and
          # took the notes bot down for two days before anyone noticed. The
          # image this instance needs belongs here, where the apply reads it.
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bot_organizer
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bot-organizer-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bot-organizer-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: bot-organizer-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d bot_organizer"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d bot_organizer"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: bot-organizer-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

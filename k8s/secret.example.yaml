# Copy to k8s/secret.yaml, fill in real values, then apply it manually:
#   kubectl apply -f k8s/secret.yaml
# k8s/secret.yaml is gitignored. Never commit real tokens or keys.
apiVersion: v1
kind: Secret
metadata:
  name: bot-organizer-secrets
type: Opaque
stringData:
  BOT_ORGANIZER_BOT_TOKEN: ""
  # No GROQ_API_KEY or GEMINI_API_KEY. This bot calls no model provider
  # directly — every model call goes through ai-proxy, which holds those keys
  # in its own Secret. Keys here were unused by any code path and only widened
  # what a leak of this Secret would expose.
  #
  # Maps, not models: this one the bot does use directly.
  GOOGLE_MAPS_API_KEY: ""
  POSTGRES_USER: bot_organizer
  POSTGRES_PASSWORD: ""
  DATABASE_URL: postgresql://bot_organizer:CHANGEME@bot-organizer-postgres:5432/bot_organizer

# Copy to k8s/secret.yaml, fill in real values, then apply it manually:
#   kubectl apply -f k8s/secret.yaml
# k8s/secret.yaml is gitignored. Never commit real tokens or keys.
apiVersion: v1
kind: Secret
metadata:
  name: bot-organizer-secrets
type: Opaque
stringData:
  BOT_ORGANIZER_BOT_TOKEN: ""
  GEMINI_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
  POSTGRES_USER: bot_organizer
  POSTGRES_PASSWORD: ""
  DATABASE_URL: postgresql://bot_organizer:CHANGEME@bot-organizer-postgres:5432/bot_organizer

# Copy to k8s/secret.yaml, fill in real values, then apply it manually:
#   kubectl apply -f k8s/secret.yaml
# k8s/secret.yaml is gitignored. Never commit real tokens or keys.
apiVersion: v1
kind: Secret
metadata:
  name: bot-organizer-secrets
type: Opaque
stringData:
  BOT_ORGANIZER_BOT_TOKEN: ""
  # Optional, but the cluster Secret already has it and the bot is quieter
  # about its absence than you would like: it logs one warning at startup and
  # then runs on Gemini alone, losing the two GPT-OSS models that sit in front
  # of it in the chain. Recreating this Secret without the key is a silent
  # downgrade, which is why it is listed here.
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
  POSTGRES_USER: bot_organizer
  POSTGRES_PASSWORD: ""
  DATABASE_URL: postgresql://bot_organizer:CHANGEME@bot-organizer-postgres:5432/bot_organizer

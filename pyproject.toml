[project]
name = "bot-organizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8",
    "google-genai>=0.5",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymorphy3>=2.0.6",
    "aiohttp>=3.14.3",
]
# No groq SDK: this bot calls no model provider directly, so nothing imports
# it. google-genai stays, but only as a schema library — bot/tools/schema.py
# writes tool declarations in its types and bot/ai/tool_schema_openai.py
# renders them into the OpenAI dialect. No genai.Client is ever constructed.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "db", "worker"]

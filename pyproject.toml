[project]
name = "bot-organizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8",
    "google-genai>=0.5",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "db", "worker"]
